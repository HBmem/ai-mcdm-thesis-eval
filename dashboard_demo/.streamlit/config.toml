[theme]
base = "light"
primaryColor = "#0f766e"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f5"
textColor = "#172b3a"
borderColor = "#dbe5e8"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
font = "sans-serif"
chartCategoricalColors = ["#0f766e", "#2563eb", "#b45309", "#7c3aed", "#64748b", "#be185d"]

[theme.sidebar]
backgroundColor = "#f1f5f5"
secondaryBackgroundColor = "#ffffff"
